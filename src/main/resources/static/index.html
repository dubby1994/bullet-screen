<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Say what you want to say</title>
    <script src="/js/jquery-3.1.1.min.js"></script>
    <script src="/js/stomp.umd.min.js"></script>
    <script src="/js/index.js"></script>
    <link rel="icon" href="/favicon.jpg" type="image/jpg">
    <style>
        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        #barrage-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .barrage {
            position: absolute;
            white-space: nowrap;
            font-size: 20px;
            font-weight: bold;
            animation-name: moveLeft;
            animation-timing-function: linear;
            animation-fill-mode: forwards; /* 保持动画结束状态 */
            animation-play-state: running;
        }

        /* 鼠标悬停暂停动画 */
        .barrage:hover {
            animation-play-state: paused;
        }

        @keyframes moveLeft {
            0% {
                transform: translateX(100vw); /* 屏幕最右侧外开始 */
            }
            100% {
                transform: translateX(-100%); /* 移动到屏幕左边外 */
            }
        }

        /*#inputBox {*/
        /*    position: absolute;*/
        /*    bottom: 20px;*/
        /*    left: 50%;*/
        /*    transform: translateX(-50%);*/
        /*    display: flex;*/
        /*}*/

        #inputBox {
            position: fixed; /* 改为 fixed，跟随视口 */
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            z-index: 9999; /* 确保在最上层 */
        }

        #inputBox input {
            width: 600px;
            padding: 8px;
            border-radius: 10px;
            border: none;
            font-size: x-large;
        }

        #inputBox button {
            margin-left: 8px;
            padding: 8px 16px;
            border: none;
            background: green;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: x-large;
        }
    </style>

    <!-- Clarity tracking code for https://xuehaiwuya.site/ -->

        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () {
                (c[a].q = c[a].q || []).push(arguments)

            t.async = 1;

</head>
<body>
<div id="barrage-container"></div>

<div id="inputBox">
    <input type="text" id="bulletInput" placeholder="Say what you want to say"/>
    <button id="sendBtn">send</button>
</div>

</body>
</html>
