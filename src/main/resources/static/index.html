<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speak your heart to the world</title>
    <script src="/js/jquery-3.1.1.min.js"></script>
    <script src="/js/stomp.umd.min.js"></script>
    <script src="/js/index.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        #barrage-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .barrage {
            position: absolute;
            white-space: nowrap;
            font-size: 20px;
            font-weight: bold;
            animation: moveLeft linear;
        }

        @keyframes moveLeft {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }

        #inputBox {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
        }

        #inputBox input {
            width: 300px;
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        #inputBox button {
            margin-left: 8px;
            padding: 8px 16px;
            border: none;
            background: #ff4081;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="barrage-container"></div>

<div id="inputBox">
    <input type="text" id="bulletInput" placeholder="Speak your heart to the world" />
    <button id="sendBtn">send</button>
</div>

</body>
</html>
